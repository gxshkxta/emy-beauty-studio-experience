<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMY Beauty Experience - Общи условия</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/glass.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="margin: 0; padding: 20px; font-family: 'Calibri', sans-serif; background-color: #0d0411; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;">

    <!-- Фоново изображение -->
    <img src="emy-bgapp.png" id="app-bg" alt="EMY Background" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.6;">

    <!-- Стъклен панел със съдържанието -->
    <div class="glass-panel" style="width: 100%; max-width: 600px; background: rgba(25, 10, 30, 0.75); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-weight: 400; color: #ffd700; margin: 0;">Общи условия</h2>
            <a href="index.html" style="color: #fff; font-size: 1.2rem; text-decoration: none; background: rgba(255,255,255,0.1); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-arrow-left"></i>
            </a>
        </div>

        <div style="font-size: 0.9rem; line-height: 1.6; color: #e0e0e0; max-height: 60vh; overflow-y: auto; padding-right: 10px;">
            <p style="margin-bottom: 15px;">Тук ще запишем официалните общи условия за ползване на услугите в EMY Beauty Studio...</p>
            <p style="margin-bottom: 15px;">1. Запазване на час и потвърждение.</p>
            <p style="margin-bottom: 15px;">2. Отговорности на студиото и клиента.</p>
            <p style="margin-bottom: 15px;">3. Условия за промяна на график.</p>
        </div>

        <div style="margin-top: 25px; text-align: center;">
            <a href="index.html" class="btn-gold" style="display: inline-block; padding: 10px 25px; background: linear-gradient(135deg, #ffd700, #cca600); color: #0d0411; text-decoration: none; border-radius: 25px; font-weight: bold; box-shadow: 0 4px 15px rgba(255,215,0,0.3);">
                НАСРЕЩА КЪМ РЕЗЕРВАЦИИТЕ
            </a>
        </div>

    </div>

</body>
</html>
