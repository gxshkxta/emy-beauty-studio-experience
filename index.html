<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMY | Phase 2 Layout</title>
    
    <!-- FontAwesome за иконките в менюто и социалните мрежи -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Зареждане на двигателите -->
    <link rel="stylesheet" href="css/atmosphere.css">
    <link rel="stylesheet" href="css/glass.css">
    <link rel="stylesheet" href="css/layout.css"> <!-- НОВИЯТ ФАЙЛ ЗА ФАЗА 2 -->
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- LAYER 1: ФОНЪТ -->
    <img src="emy-bg.png" id="emy-atmosphere" alt="EMY Background">

    <!-- LAYER 2: ГЛОБАЛНА НАВИГАЦИЯ (HEADER) -->
    <header class="emy-header">
        <!-- Ляво: Лого и бранд -->
        <!-- Ляво: Лого и бранд -->
        <div class="header-logo">
            <div class="hamburger-menu">
                <i class="fas fa-bars"></i>
            </div>
            <div class="logo-text">
                <span class="logo-title">EMY</span>
                <span class="logo-sub">beauty studio experience</span>
            </div>
        </div>

        <!-- Център: Основно меню -->
        <nav class="header-nav">
            <a href="#"><i class="fas fa-leaf"></i> Studio <i class="fas fa-chevron-down arrow"></i></a>
            <a href="#"><i class="fas fa-shopping-bag"></i> EMY Care <i class="fas fa-chevron-down arrow"></i></a>
            <a href="#"><i class="fas fa-graduation-cap"></i> EMY Academy <i class="fas fa-chevron-down arrow"></i></a>
            <a href="#"><i class="far fa-calendar-alt"></i> Calendar</a>
        </nav>

        <!-- Дясно: Потребител и Социални мрежи -->
        <div class="header-actions">
            <a href="#" class="my-emy"><i class="far fa-user"></i> My EMY <i class="fas fa-chevron-down arrow"></i></a>
            <div class="separator"></div>
            <div class="socials">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-tiktok"></i></a>
                <a href="#"><i class="fab fa-whatsapp"></i></a>
                <a href="#"><i class="fas fa-shopping-cart"></i></a>
            </div>
        </div>
    </header>

    <!-- LAYER 3: ОСНОВНО СЪДЪРЖАНИЕ -->
    <main class="styleguide-container">
        <!-- Оставяме тестовия панел като маркер за центъра на екрана -->
        <div class="emy-glass">
            <h1>EMY</h1>
            <p>Phase 2: Global Layout Active</p>
        </div>
    </main>
</body>
</html>
